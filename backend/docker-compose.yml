# Local dev database only — the deployment DB is native PostgreSQL on the
# Ubuntu Server VM (deploy/server-provision.sh, ADR-0004).
#
# Host port is 5433 because a Windows postgres.exe service already occupies
# 5432 on this machine. DATABASE_URL in backend/.env points at 5433.
#
#   docker compose up -d      (from backend/)
#   docker compose down       (data survives in the named volume)
services:
  db:
    image: postgres:16-alpine
    container_name: hms-postgres
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_dev_password
      POSTGRES_DB: hms
    ports:
      - "5433:5432"
    volumes:
      - hms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hms-pgdata: